[project]
name = "docker-devkit"
version = "0.5.9"
description = "Docker-stack lifecycle commands (up/down/build) driven by a pyproject-declared compose assembly"
requires-python = ">=3.13"
dependencies = [
    "bashrun>=0.1.0",
    "packaging>=24.1",
    "pathspec>=1.0.4",
    "pydantic>=2.11.7",
    "pyyaml>=6.0",
    "strictyaml>=1.7.3",
    "typer>=0.17.4",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "ruff>=0.14.11",
    "pytest>=8.0.0",
    "python-devkit>=0.3.0.dev0",
    "types-pyyaml>=6.0.12.20260906",
    "types-strictyaml>=1.7.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
up = "docker_devkit.verbs.up:app"
down = "docker_devkit.verbs.down:app"
build = "docker_devkit.verbs.build:app"
lock = "docker_devkit.verbs.lock:app"
lock-env = "docker_devkit.verbs.lock_env:app"
tree-tags = "docker_devkit.verbs.tree_tags:app"
mirror = "docker_devkit.verbs.mirror:app"
publish-compose = "docker_devkit.verbs.publish:app"
generate-score = "docker_devkit.verbs.score:app"
docker-build-matrix = "docker_devkit.verbs.matrix:app"

[tool.hatch.build.targets.wheel]
packages = ["src/docker_devkit"]

[tool.uv.sources]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
