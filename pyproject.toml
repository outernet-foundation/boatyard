[project]
name = "boatyard"
version = "0.6.0"
description = "Deploy-files definition language and compiler, plus a runtime for the compose target"
requires-python = ">=3.13"
dependencies = [
    "bashrun>=0.1.0",
    "packaging>=24.1",
    "pathspec>=1.0.4",
    "pydantic>=2.11.7",
    "pyyaml>=6.0",
    "strictyaml>=1.7.3",
    "typer>=0.17.4",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "ruff>=0.14.11",
    "pytest>=8.0.0",
    "python-devkit>=0.3.0.dev0",
    "types-pyyaml>=6.0.12.20260906",
    "types-strictyaml>=1.7.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
boatyard = "boatyard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/boatyard"]

[tool.uv.sources]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
